name: Release

# v0.1.0 のようなタグを push すると、Windows 用のインストーラーを作って GitHub Release に置く。
# タグは main のコミットに付け、package.json の version と揃える（どちらかが違うと止まる）
on:
  push:
    tags: ['v*']

# 同じタグで2つ同時に走らせない
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 依存パッケージを入れてビルドするジョブ。権限は読み取りだけにする
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main に含まれるコミットかを確かめるため、ブランチの履歴も取ってくる
          fetch-depth: 0
          persist-credentials: false

      - name: タグが main のコミットに付いているか確かめる
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::タグ $GITHUB_REF_NAME のコミットが main に含まれていません。main にマージしてからタグを付けてください"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # リリースは依存パッケージをキャッシュから戻さず、毎回取ってくる
          package-manager-cache: false

      - name: タグと package.json の version が揃っているか確かめる
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と package.json の version $version が違います"
            exit 1
          fi

      # postinstallでElectron本体のダウンロードも行う
      - run: npm ci

      - run: npm run lint

      - run: npm test

      # build:win は型チェックも行う。公開は下の gh で行うので、electron-builder には公開させない
      - run: npm run build:win -- --publish never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: dist/mokkan-*-setup.exe
          if-no-files-found: error
          # Release に置いた後は要らないので、すぐ消す
          retention-days: 1

  # Release を作るジョブ。書き込みの権限はここにだけ付け、依存パッケージは入れない（checkout もしない）
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dist

      # コード署名をしていないので、取ってきたファイルを確かめられるようにハッシュ値も置く
      - name: SHA-256 のハッシュ値を作る
        working-directory: dist
        run: sha256sum mokkan-*-setup.exe > SHA256SUMS.txt

      - name: Release を作ってインストーラーを置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mokkan-*-setup.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "mokkan $GITHUB_REF_NAME" \
            --generate-notes
