appId: com.kanjiyamamoto66.mokkan
productName: mokkan
copyright: Copyright © 2026 kanjiyamamoto66
directories:
  buildResources: build
  output: dist
# 同梱するのはビルド結果（out/）と、裏方が使うアイコンだけ。
# 画面のパッケージは out/renderer にまとめて出力済みなので、package.json の dependencies には
# 裏方が実行時に require するもの（out/main/index.js の require を参照）だけを置く
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
# mokkan のライセンスと、画面・preload にまとめたパッケージのライセンスの一覧を、インストール先の licenses/ に置く
# （Electron と Chromium のものは、electron-builder がインストール先に置く）
extraFiles:
  - from: LICENSE
    to: licenses/mokkan-LICENSE.txt
  - from: out/renderer/THIRD_PARTY_LICENSES.md
    to: licenses/renderer-THIRD_PARTY_LICENSES.md
  - from: out/preload/THIRD_PARTY_LICENSES.md
    to: licenses/preload-THIRD_PARTY_LICENSES.md
win:
  executableName: mokkan
  target:
    - target: nsis
      arch: x64
# ワンクリック形式：ユーザーごとに %LOCALAPPDATA%\Programs\mokkan へ入れる（管理者権限は不要）。
# 設定（%APPDATA%\mokkan）とタスクのデータ（tasks/）はアンインストールしても消さない
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerLanguages:
    - ja_JP
  language: '1041'
# Mac は、ここではアプリ（mokkan.app）だけを作り（electron-builder --mac --dir）、
# scripts/package-mac.sh が ad-hoc 署名をし直して zip にする（理由はそのスクリプトを参照）。
# Apple シリコン用と Intel 用を別々に作る（両方入りの universal は大きくなるため）
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # 証明書での署名と公証（notarization）はしない。ad-hoc 署名は package-mac.sh で付ける
  identity: null
# Linux は Ubuntu・Debian 向けの deb（x64）だけを作る。
# AppImage は、Ubuntu 24.04 以降の制限（AppArmor）で Chromium の sandbox が動かず起動しないことがあるので作らない
# （deb は入れるときに、AppArmor が有効なら mokkan 用のプロファイルを置き、user namespace が使えない環境では
# chrome-sandbox を root の setuid にするので、制限の下でも sandbox が動く。scripts/smoke-linux.sh で確かめる）
linux:
  executableName: mokkan
  # Wayland でウィンドウとアイコン（mokkan.desktop）を結び付ける（package.json の desktopName）
  syncDesktopName: true
  icon: build/icon.png
  category: Office
  synopsis: 標準の md ファイルで管理する、個人用のタスク管理アプリ
  # deb には管理者の名前とメールが要る（コミットと同じ GitHub の noreply を使う）
  maintainer: kanjiyamamoto66 <344183349+kanjiyamamoto66@users.noreply.github.com>
  target:
    - target: deb
      arch: x64
# /opt/mokkan に入れ、/usr/bin/mokkan から起動できるようにする。設定は ~/.config/mokkan
deb:
  artifactName: ${name}-${version}-linux-amd64.${ext}
  # electron-builder の既定の依存に、音（libasound）と描画（libgbm）のライブラリを足す。
  # ないと最小構成の Ubuntu（WSL など）で起動できない。Ubuntu 24.04 以降の音のパッケージは libasound2t64
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
  # 日本語と絵文字（所要時間の ⏱ など）のフォント。Ubuntu のデスクトップには初めからあるが、
  # 最小構成（WSL など）にはなく、文字が □ になる。apt は推奨（Recommends）も既定で入れる。
  # 既定の libappindicator3-1 はトレイを使わないので外す
  recommends:
    - fonts-noto-cjk
    - fonts-noto-color-emoji
npmRebuild: false
# 配布するアプリで使わない機能を切っておく（Electron の Fuses）
# - 環境変数（ELECTRON_RUN_AS_NODE・NODE_OPTIONS）や --inspect で、アプリを素の Node として動かしたり中を書き換えたりさせない
# - アプリのコードは app.asar からだけ読み、その中身が改ざんされていないかを確かめる
# grantFileProtocolExtraPrivileges は既定のまま（画面を file:// から ES モジュールで読んでいるため）
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
# 自動更新はまだ使わない。リリースは .github/workflows/release.yml が GitHub Release に置く
publish: null
